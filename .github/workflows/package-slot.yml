name: Package playable slot
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --package-lock=false
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: mad-carnival-playable-web
          path: dist/
          if-no-files-found: error
